name = "lenscrafter"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Routes
routes = [
	{ pattern = "airail.io/mcp/*", zone_name = "airail.io" }
]

# Bindings
[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[kv_namespaces]]
binding = "LENS_CACHE"
id = "128c3635855f4eb69711ef1473643709"
preview_id = "todo_replace_with_preview_id"

[observability]
enabled = true
